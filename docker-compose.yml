version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairresolve-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DEMO_MODE=${DEMO_MODE:-false}
      - SERVICE_TYPE=app
      - RUN_IN_PROCESS_WORKER=false
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PAYPAL_ENVIRONMENT=sandbox
      - PAYPAL_LIVE_ENABLED=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgres://${POSTGRES_USER:-fairresolve}:${POSTGRES_PASSWORD:-fairresolve_secret}@postgres:5432/${POSTGRES_DB:-fairresolve}
    volumes:
      - fairresolve_data:/app/data
      - fairresolve_uploads:/app/private_uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairresolve-worker
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SERVICE_TYPE=worker
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_ENVIRONMENT=sandbox
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgres://${POSTGRES_USER:-fairresolve}:${POSTGRES_PASSWORD:-fairresolve_secret}@postgres:5432/${POSTGRES_DB:-fairresolve}
    volumes:
      - fairresolve_data:/app/data
      - fairresolve_uploads:/app/private_uploads
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fairresolve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairresolve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairresolve_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fairresolve}
    volumes:
      - fairresolve_pgdata:/var/lib/postgresql/data
      - ./src/server/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairresolve} -d ${POSTGRES_DB:-fairresolve}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fairresolve_data:
  fairresolve_uploads:
  fairresolve_pgdata:
